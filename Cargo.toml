[package]
name = "quicknotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Minimal terminal notes, todos and code snippets"
license = "MIT"
publish = false

[lib]
name = "quicknotes"
path = "src/lib.rs"

[[bin]]
name = "qn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
directories = "6"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.4"
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-markdown = "0.3"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
