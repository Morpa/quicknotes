[package]
name = "quicknotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Minimal terminal notes, todos and code snippets"
license = "MIT"
publish = false

[lib]
name = "quicknotes"
path = "src/lib.rs"

[[bin]]
name = "qn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
ratatui = "0.30"
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
